# User Service GraphQL Schema

type Query {
    """Get all users (paginated)"""
    users(first: Int = 15, page: Int = 1): UserPaginated! @field(resolver: "App\\GraphQL\\Queries\\UserQueries@users")

    """Get a single user by ID"""
    user(id: Int!): User @field(resolver: "App\\GraphQL\\Queries\\UserQueries@user")

    """Get user with their orders"""
    userWithOrders(id: Int!): UserWithOrders @field(resolver: "App\\GraphQL\\Queries\\UserQueries@userWithOrders")

    """Get user order summary from Order Service"""
    userOrderSummary(id: Int!): UserOrderSummary @field(resolver: "App\\GraphQL\\Queries\\UserQueries@userOrderSummary")

    """Login user"""
    login(email: String!, password: String!): AuthPayload @field(resolver: "App\\GraphQL\\Queries\\UserQueries@login")

    """Get authenticated user by token"""
    me(token: String!): User @field(resolver: "App\\GraphQL\\Queries\\UserQueries@me")
}

type Mutation {
    """Register a new active user and return auth token"""
    registerUser(name: String!, email: String!, password: String!): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\UserMutations@registerUser")

    """Create a new user"""
    createUser(name: String!, email: String!, password: String!, is_active: Boolean = true): User! @field(resolver: "App\\GraphQL\\Mutations\\UserMutations@createUser")

    """Update user"""
    updateUser(id: Int!, name: String, email: String, password: String, is_active: Boolean): User @field(resolver: "App\\GraphQL\\Mutations\\UserMutations@updateUser")

    """Activate or deactivate user account"""
    updateUserStatus(id: Int!, is_active: Boolean!): User @field(resolver: "App\\GraphQL\\Mutations\\UserMutations@updateUserStatus")

    """Logout user by revoking token"""
    logout(token: String!): DeletePayload! @field(resolver: "App\\GraphQL\\Mutations\\UserMutations@logout")

    """Delete user"""
    deleteUser(id: Int!): DeletePayload! @field(resolver: "App\\GraphQL\\Mutations\\UserMutations@deleteUser")
}

"""User type"""
type User {
    id: Int!
    name: String!
    email: String!
    is_active: Boolean!
    created_at: String!
    updated_at: String!
}

"""User with Orders (joined data from Order Service)"""
type UserWithOrders {
    user: User!
    orders: [OrderData!]!
}

"""User order summary from Order Service"""
type UserOrderSummary {
    user: User!
    summary: OrderSummary!
}

"""Aggregated order summary"""
type OrderSummary {
    total_orders: Int!
    total_spent: Float!
    average_order_value: Float!
    active_orders: Int!
    completed_orders: Int!
    failed_orders: Int!
    cancelled_orders: Int!
    latest_order: OrderData
    status_breakdown: [StatusCount!]!
}

"""Status count"""
type StatusCount {
    status: String!
    count: Int!
}

"""Paginated Users"""
type UserPaginated {
    data: [User!]!
    current_page: Int!
    per_page: Int!
    total: Int!
}

"""Authentication Payload"""
type AuthPayload {
    user: User!
    token: String
    token_type: String
}

"""Delete Payload"""
type DeletePayload {
    success: Boolean!
    message: String!
}

"""Order Data (for user's orders - from Order Service)"""
type OrderData {
    id: Int!
    user_id: Int!
    user_name: String
    food_id: Int!
    food_name: String!
    unit_price: Float
    quantity: Int!
    total_price: Float!
    status: String!
    created_at: String!
    updated_at: String
}
